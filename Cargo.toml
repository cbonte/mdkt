[package]
name = "mdkt"
description = "Render Markdown as styled text in the terminal"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cbonte/mdkt"

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5", default-features = false, features = [
    "default-syntaxes",
    "default-themes",
    "regex-fancy",
    "parsing",
    "dump-load",
] }
unicode-width = "0.2"
clap = { version = "4", features = ["derive", "wrap_help"] }
terminal_size = "0.4"
anyhow = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
